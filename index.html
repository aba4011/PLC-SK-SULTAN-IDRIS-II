<!DOCTYPE html><html lang="ms"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Generator OPR PLC Sekolah</title>  <link rel="stylesheet" href="style.css"></head><body>  <div class="container">    <header class="header">      <h1>SISTEM GENERATOR ONE PAGE REPORT (OPR) PLC</h1>      <p>Isi borang di bawah untuk menjana laporan PLC secara automatik</p>    </header>    <form id="oprForm" onsubmit="event.preventDefault(); submitForm();">      <!-- A. MAKLUMAT UTAMA PLC -->      <section class="card">        <h2>A. MAKLUMAT UTAMA PLC</h2>                <div class="form-group">          <label>Strategi PLC <span class="required">*</span></label>          <div class="dropdown-wrapper">            <input type="text" id="plcStrategySearch" placeholder="Taip / pilih strategi..." autocomplete="off">            <input type="hidden" id="plcStrategy">            <div id="plcStrategyDropdown" class="dropdown-list"></div>          </div>        </div>        <div class="form-group">          <label for="plcFocus">Tajuk / Fokus PLC <span class="required">*</span></label>          <input type="text" id="plcFocus" placeholder="Contoh: Bengkel Teknik Menjawab SPM Sejarah" required>        </div>        <div class="form-row">          <div class="form-group col">            <label for="plcDate">Tarikh <span class="required">*</span></label>            <input type="date" id="plcDate" required>          </div>          <div class="form-group col">            <label for="startTime">Masa Mula <span class="required">*</span></label>            <input type="time" id="startTime" required>          </div>          <div class="form-group col">            <label for="endTime">Masa Tamat <span class="required">*</span></label>            <input type="time" id="endTime" required>          </div>        </div>        <div class="form-row">          <div class="form-group col">            <label for="plcLocation">Tempat <span class="required">*</span></label>            <input type="text" id="plcLocation" placeholder="Contoh: Bilik Mesyuarat Utama" required>          </div>          <div class="form-group col">            <label for="groupName">Nama Kumpulan / Panitia <span class="required">*</span></label>            <input type="text" id="groupName" placeholder="Contoh: Panitia Bahasa Melayu" required>          </div>        </div>        <div class="form-row">          <div class="form-group col">            <label>Ketua Kumpulan <span class="required">*</span></label>            <div class="dropdown-wrapper">              <input type="text" id="groupLeaderSearch" placeholder="Taip nama ketua..." autocomplete="off">              <input type="hidden" id="groupLeader">              <div id="groupLeaderDropdown" class="dropdown-list"></div>            </div>          </div>          <div class="form-group col">            <label>Disediakan Oleh <span class="required">*</span></label>            <div class="dropdown-wrapper">              <input type="text" id="preparedBySearch" placeholder="Taip nama penyedia..." autocomplete="off">              <input type="hidden" id="preparedBy">              <div id="preparedByDropdown" class="dropdown-list"></div>            </div>          </div>        </div>      </section>      <!-- B. AHLI KUMPULAN -->      <section class="card">        <h2>B. AHLI KUMPULAN PLC</h2>        <div id="membersContainer"></div>        <button type="button" class="btn btn-secondary" onclick="addMemberRow()">+ Tambah Ahli Kumpulan</button>      </section>      <!-- C - G. KANDUNGAN LAPORAN -->      <section class="card">        <h2>C - G. BUTIRAN LAPORAN</h2>        <div class="form-group">          <label for="plcIssue">C. Isu / Masalah <span class="required">*</span></label>          <textarea id="plcIssue" rows="3" placeholder="Nyatakan isu atau masalah utama yang dihadapi..." required></textarea>        </div>        <div class="form-group">          <label for="plcObjective">D. Objektif Program <span class="required">*</span></label>          <textarea id="plcObjective" rows="3" placeholder="Nyatakan objektif pelaksanaan PLC ini..." required></textarea>        </div>        <div class="form-group">          <label for="plcImplementation">E. Pelaksanaan / Aktiviti <span class="required">*</span></label>          <textarea id="plcImplementation" rows="4" placeholder="Terangkan langkah-langkah pelaksanaan aktiviti..." required></textarea>        </div>        <div class="form-group">          <label for="plcImpact">F. Impak / Hasil <span class="required">*</span></label>          <textarea id="plcImpact" rows="3" placeholder="Nyatakan hasil atau perubahan selepas program..." required></textarea>        </div>        <div class="form-group">          <label for="plcFollowup">G. Tindakan Susulan <span class="required">*</span></label>          <textarea id="plcFollowup" rows="3" placeholder="Nyatakan tindakan susulan yang akan diambil..." required></textarea>        </div>      </section>      <!-- H. GAMBAR AKTIVITI -->      <section class="card">        <h2>H. GAMBAR AKTIVITI (MAKSIMUM 4 GAMBAR)</h2>        <div class="photo-grid">          <div class="photo-box">            <label>Gambar 1</label>            <input type="file" accept="image/*" onchange="previewImage(this, 'preview1')">            <img id="preview1" class="image-preview" alt="Preview 1">          </div>          <div class="photo-box">            <label>Gambar 2</label>            <input type="file" accept="image/*" onchange="previewImage(this, 'preview2')">            <img id="preview2" class="image-preview" alt="Preview 2">          </div>          <div class="photo-box">            <label>Gambar 3</label>            <input type="file" accept="image/*" onchange="previewImage(this, 'preview3')">            <img id="preview3" class="image-preview" alt="Preview 3">          </div>          <div class="photo-box">            <label>Gambar 4</label>            <input type="file" accept="image/*" onchange="previewImage(this, 'preview4')">            <img id="preview4" class="image-preview" alt="Preview 4">          </div>        </div>      </section>      <div class="action-bar">        <button type="submit" id="submitBtn" class="btn btn-primary">GENERATE OPR & SIMPAN</button>      </div>    </form>  </div>  <div id="toast" class="toast"></div>  <script src="config.js"></script>  <script src="script.js"></script></body></html>
